<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch anime | KageAnime</title><style>*{box-sizing:border-box}body{margin:0;background:#09090c;color:#f7f7f8;font:15px system-ui,sans-serif}header{display:flex;align-items:center;padding:22px 5%;border-bottom:1px solid #25252a}.logo{font-weight:850;letter-spacing:-1px;font-size:23px;color:white;text-decoration:none}header a.back{margin-left:auto;color:#dadade;text-decoration:none;background:#202026;padding:10px 18px;border-radius:100px;font-size:13px}.wrap{max-width:1260px;margin:auto;padding:35px 5% 80px}.label{font-size:10px;color:#9d9da4;font-weight:700;letter-spacing:2px}.title{font-size:clamp(24px,3vw,38px);letter-spacing:-1px;margin:12px 0 20px}.player{background:#000;border:1px solid #29292d;aspect-ratio:16/9;display:grid;place-items:center;border-radius:12px;overflow:hidden}.player iframe,.player video{width:100%;height:100%;border:0}.status{padding:30px;text-align:center;color:#a3a3ad;max-width:500px;line-height:1.7}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:35px}.row h2{font-size:21px;letter-spacing:-.5px}.row small{color:#9898a2}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:9px;max-height:440px;overflow:auto}.ep{background:#1e1e24;color:#eee;border:1px solid #ffffff12;border-radius:9px;min-height:44px;cursor:pointer;font-size:13px}.ep:hover,.ep.active{background:#eee;color:#111}.empty{color:#9696a0;font-size:13px}.note{font-size:12px;color:#86868f;line-height:1.7;margin-top:30px}@media(max-width:600px){header{padding:18px 5%}.wrap{padding-top:25px}.player{border-radius:8px}.episodes{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}}</style></head><body><header><a class="logo" href="/">✦ kageanime</a><a class="back" href="/">← Back to browse</a></header><main class="wrap"><div class="label">NOW WATCHING</div><h1 class="title" id="title">Loading anime...</h1><div class="player" id="player"><div class="status">Loading player...</div></div><div class="row"><h2>Episodes</h2><small id="count"></small></div><div class="episodes" id="episodes"></div><p class="note">Playback depends on the external video provider. Some titles may not have an embeddable video available.</p></main><script>
const initial=new URLSearchParams(location.search).get('url');let episodeList=[],currentWatchUrl=initial;const title=document.querySelector('#title'),player=document.querySelector('#player'),list=document.querySelector('#episodes');function episodeNumber(e,index){let text=e.title||'';let m=text.match(/episode\s*(\d+)/i)||text.match(/^\s*(\d+)/)||e.url.match(/episode[-/](\d+)/i)||e.url.match(/\d+x(\d+)/);return m?String(parseInt(m[1],10)):String(index+1)}function displayEpisodes(current){list.innerHTML='';document.querySelector('#count').textContent=episodeList.length?episodeList.length+' episodes':'';episodeList.forEach((ep,i)=>{let b=document.createElement('button');b.className='ep'+(ep.url===current?' active':'');b.textContent=episodeNumber(ep,i);b.setAttribute('aria-label','Episode '+b.textContent);b.onclick=()=>openEpisode(ep.url,true);list.append(b)});if(!episodeList.length)list.innerHTML='<p class="empty">No episode list is available for this title.</p>'}async function openEpisode(url,replace){currentWatchUrl=url;if(!url){title.textContent='No anime selected';player.innerHTML='<div class="status">Return to browse and choose an anime.</div>';return}player.innerHTML='<div class="status">Loading player...</div>';try{let r=await fetch('/api/watch?'+new URLSearchParams({url}));let d=await r.json();if(!r.ok)throw Error(d.error||'Could not load this episode.');title.textContent=d.title||'Anime';document.title=title.textContent+' | KageAnime';if(d.episodes&&d.episodes.length)episodeList=d.episodes;displayEpisodes(url);player.innerHTML='';if(d.frames&&d.frames.length){let f=document.createElement('iframe');f.src=d.frames[0];f.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';player.append(f)}else{let msg=document.createElement('div');msg.className='status';msg.textContent=d.reason||'No playable video was found for this title.';player.append(msg)}if(replace)history.replaceState(null,'','/watch?'+new URLSearchParams({url}))}catch(e){player.textContent='';let msg=document.createElement('div');msg.className='status';msg.textContent=e.message;player.append(msg)}}openEpisode(initial,false);setInterval(async()=>{if(document.hidden||!currentWatchUrl)return;try{let requested=currentWatchUrl;let r=await fetch('/api/watch?'+new URLSearchParams({url:requested}));let d=await r.json();if(r.ok&&currentWatchUrl===requested&&d.episodes&&d.episodes.length){episodeList=d.episodes;displayEpisodes(requested)}}catch(e){}},300000);
</script></body></html>
